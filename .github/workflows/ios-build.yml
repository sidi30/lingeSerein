name: iOS Build (CI Mac) → TestFlight

# Builds the iOS .ipa LOCALLY on a GitHub-hosted macOS runner via
# `eas build --local`. Consumes GitHub Actions minutes — NOT the EAS cloud
# build quota — so it works even when the free EAS allotment is exhausted.
# The runner provides macOS + Xcode (a Windows dev box can't), while the
# account, projectId, credentials and OTA channels stay untouched.
#
# Manual trigger only (Actions tab → Run workflow). One run = one TestFlight build.
#
# Secrets utilisés
#
#   EXPO_TOKEN  (obligatoire)
#     https://expo.dev/accounts/sidi30/settings/access-tokens
#
#   EXPO_APPLE_ID + EXPO_APPLE_APP_SPECIFIC_PASSWORD  (voir ci-dessous)
#     Mot de passe d'application à créer sur https://appleid.apple.com
#     (Connexion et sécurité → Mots de passe des apps). Ce n'est PAS le mot de
#     passe du compte Apple, et il contourne la 2FA — c'est ce qui rend
#     l'opération possible sans intervention humaine.
#
# POURQUOI ces deux secrets Apple, alors que les credentials vivent chez EAS.
#
# Sans authentification Apple, `eas build --non-interactive` écrit dans son log :
#
#   Skipping Provisioning Profile validation on Apple Servers
#   because we aren't authenticated.
#
# Il réutilise alors tel quel le profil stocké, SANS vérifier qu'il correspond
# encore aux entitlements de l'app. C'est ce qui a fait échouer les builds 13, 14
# et 15 de la v0.3.0 : le profil date du 10/06/2026, donc d'avant l'ajout
# d'`expo-notifications`, et ne porte ni la capability Push Notifications ni
# `aps-environment`. Xcode refuse de signer.
#
# Authentifié, EAS valide le profil auprès d'Apple, active la capability
# manquante sur l'App ID et régénère le profil — automatiquement, à chaque build.
# Le problème se répare donc tout seul, ici, plutôt que dans un menu interactif.
#
# Si les deux secrets sont absents, le build tourne quand même : il retombe sur
# le comportement non authentifié, et échouera tant que le profil n'aura pas été
# régénéré à la main (`eas credentials -p ios`).

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit the build to TestFlight after building"
        type: boolean
        default: true

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # `secrets` n'est pas lisible depuis un `if:` d'étape — on le projette ici,
  # au niveau du job, où le contexte est disponible.
  HAS_APPLE_AUTH: ${{ secrets.EXPO_APPLE_ID != '' }}

jobs:
  build:
    # macos-15 ships Xcode 16.x — required by Expo SDK 55 / RN 0.83.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Pick the newest non-beta Xcode actually installed, so a runner-image
      # change can't silently downgrade us under the SDK floor.
      - name: Select latest stable Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          echo "Selecting $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installs & authenticates eas-cli (puts `eas` on PATH for all later steps).
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install deps
        run: npm ci

      # Read-only: prints the buildNumber EAS will use. If a later submit is
      # rejected for a duplicate version, this is the number to look at.
      - name: Show remote iOS build number (info)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build:version:get --platform ios --non-interactive || true

      # Local build on the CI Mac. Distribution = store (production profile),
      # so the artifact is a TestFlight/App-Store-ready .ipa.
      #
      # Versioning: eas.json has appVersionSource:remote + autoIncrement, so the
      # `eas build` pipeline bumps the buildNumber on EAS' servers and embeds it
      # before the local Xcode compile (`--local` only moves the *compile* step
      # here, not version resolution). If TestFlight ever rejects a duplicate
      # buildNumber, bump `version` in app.json and re-run.
      - name: Build .ipa locally (no EAS cloud quota)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Authentification Apple non interactive : permet à EAS de valider le
          # profil de provisionnement, de synchroniser les capabilities de l'App
          # ID et de régénérer le profil si besoin. Cf. l'en-tête du fichier.
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          eas build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/app.ipa"

      # Keep the .ipa even if submit fails — lets you submit manually later
      # without rebuilding (and burning more minutes).
      - name: Upload .ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ github.workspace }}/app.ipa
          if-no-files-found: warn
          retention-days: 7

      # Uploads to TestFlight using the App Store Connect API key on EAS
      # (ascAppId 6778966066, team 4SRJRX4N45 from eas.json submit.production).
      - name: Submit to TestFlight
        if: ${{ inputs.submit }}
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas submit \
            --platform ios \
            --profile production \
            --path "$GITHUB_WORKSPACE/app.ipa" \
            --non-interactive

      - name: Avertir si l'authentification Apple est absente
        if: env.HAS_APPLE_AUTH != 'true'
        run: |
          echo "::warning title=Pas d'authentification Apple::EXPO_APPLE_ID absent — EAS ne pourra ni valider ni régénérer le profil de provisionnement. Si la signature échoue sur la capability Push Notifications, c'est la cause."

      - name: Summary
        if: success()
        run: |
          echo "## iOS build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Built locally on \`macos-15\` (no EAS cloud quota used)." >> "$GITHUB_STEP_SUMMARY"
          echo "- Submit to TestFlight: \`${{ inputs.submit }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- .ipa uploaded as artifact \`ios-ipa\` (7-day retention)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "First build of an app → answer Export Compliance in App Store Connect (standard encryption → No)." >> "$GITHUB_STEP_SUMMARY"
