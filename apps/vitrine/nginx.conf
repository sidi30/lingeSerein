server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ---- En-têtes de sécurité ----
    #
    # `always` sur chacun : sans ce mot-clé, nginx omet l'en-tête sur les
    # réponses d'erreur (404, 5xx) — précisément celles qu'un attaquant sait
    # provoquer.
    #
    # PIÈGE nginx : un seul `add_header` dans un bloc `location` ANNULE tous
    # ceux hérités du bloc `server`. Les deux `location` de cache plus bas en
    # posent un (Cache-Control), ils redéclarent donc ce qui compte pour un
    # asset. Ajouter un `add_header` ailleurs impose la même précaution.

    # Un .js servi avec un type MIME approximatif ne doit jamais être deviné
    # puis exécuté par le navigateur.
    add_header X-Content-Type-Options "nosniff" always;

    # Anti-clickjacking. `frame-ancestors` dans la CSP dit la même chose aux
    # navigateurs récents ; X-Frame-Options couvre les plus anciens.
    add_header X-Frame-Options "DENY" always;

    # Une URL de la vitrine ne fuite jamais son chemin vers un site tiers —
    # seule l'origine part, et rien du tout en cas de passage à HTTP.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Aucune page du site n'a de raison de demander caméra, micro ou position.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HSTS posé ici, et non sur Traefik : le VPS est mutualisé entre projets
    # sans rapport, une règle globale les engagerait tous.
    # `includeSubDomains` couvre admin. et api.lingeserein.fr, déjà servis en
    # HTTPS uniquement. Pas de `preload` : l'inscription à la liste des
    # navigateurs est très difficile à défaire.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP. Les deux `unsafe-inline` sont imposés par l'export statique Next.js :
    #   - script : la charge d'hydratation est un <script> inline dans le HTML,
    #     et un nonce est impossible sur des fichiers pré-générés servis par nginx ;
    #   - style : React pose des styles inline au montage des composants.
    # `unsafe-eval` en revanche N'EST PAS nécessaire : aucun `eval(` ni
    # `new Function(` dans le bundle. On ne l'ajoute pas « au cas où ».
    #
    # Les ouvertures `blob:` et `data:` servent la génération de PDF côté
    # navigateur (@react-pdf dans contract-generator.tsx et devis-generator.tsx).
    # Elles sont indispensables, et leur absence ne produit AUCUN message
    # d'erreur visible — le bouton reste simplement sans effet :
    #   - worker-src 'self' blob: → @react-pdf compresse dans un Web Worker créé
    #     depuis un blob:. Sans cette directive, worker-src retombe sur
    #     script-src, qui n'autorise pas blob:.
    #   - connect-src data: blob: → le décodeur d'images charge son module
    #     WebAssembly depuis une data: URI, via fetch.
    #   - img-src blob: → aperçu du PDF produit.
    # Les deux ressources sont fabriquées par la page elle-même : aucune origine
    # tierce n'entre par cette porte.
    #
    # Le reste est verrouillé. Aucune origine tierce ne peut fournir de script.
    #   connect-src https://api.lingeserein.fr → envoi du formulaire de devis ;
    #   frame-src   → la carte OpenStreetMap de /zone-de-livraison ;
    #   object-src / base-uri / form-action → ferment les détournements
    #     classiques (plugin, réécriture de <base>, exfiltration de formulaire).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.lingeserein.fr data: blob:; worker-src 'self' blob:; frame-src https://www.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Next.js static export: try .html extension for clean URLs
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    # ---- /contrat : outil interne, accès restreint ----
    #
    # Le verrou est ici, dans nginx, et surtout PAS dans la page. La vitrine est
    # un export statique : un test `?admin=1` côté React ne cache rien, il ne
    # fait que masquer une interface déjà livrée au navigateur. Seul un refus
    # côté serveur empêche réellement le HTML de partir.
    #
    # Le fichier d'identifiants doit exister AVANT le démarrage du conteneur :
    # un bind-mount pointant sur un fichier absent fait créer un DOSSIER par
    # Docker, et nginx échoue alors sur chaque requête. Un fichier vide est un
    # défaut sûr — aucun utilisateur n'y est valide, donc tout le monde est
    # refusé, jamais l'inverse.
    #
    # Ce bloc ne déclare aucun `add_header` : il hérite donc des en-têtes de
    # sécurité du bloc `server` (cf. la règle d'héritage commentée plus haut).
    location /contrat {
        auth_basic "Linge Serein — administration";
        auth_basic_user_file /etc/nginx/contrat.htpasswd;
        try_files $uri $uri.html $uri/ /404.html;
    }

    # Cache static assets
    # Les en-têtes de sécurité redéclarés ici sont ceux qui ont un sens hors
    # document : `nosniff` (le contenu est du JS et du CSS) et HSTS (qui porte
    # sur la connexion). CSP, X-Frame-Options et Permissions-Policy ne
    # s'appliquent qu'à un document et n'ont rien à faire sur un asset.
    # `expires` retiré : il pose son propre Cache-Control, qui s'ajoutait à celui
    # déclaré juste en dessous — deux en-têtes Cache-Control pour une réponse.
    # Une seule directive, explicite, dit la même chose sans ambiguïté.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    error_page 404 /404.html;
}
